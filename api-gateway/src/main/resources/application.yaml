server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:

        - id: auth-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/login, /api/auth/register

        - id: auth-protected
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: JwtAuthenticationFilter

        - id: user-internal
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/internal/**

        - id: user-me
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/me
          filters:
            - name: JwtAuthenticationFilter

        - id: user-admin
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/all, /api/users/id/**, /api/users/auth/authId/**
          filters:
            - name: JwtAuthenticationFilter
            - name: RoleAuthorizationFilter
              args:
                requiredRole: ADMIN

        - id: user-protected
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**
          filters:
            - name: JwtAuthenticationFilter

        - id: parcel-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/parcels/**
          filters:
            - name: JwtAuthenticationFilter

        - id: order-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/orders/**
          filters:
            - name: JwtAuthenticationFilter

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

eureka:
  client:
    enabled: false

jwt:
  secret: f04f05344920d1531fdb13ff408d825c5cf5012354e64651c466d6cede25e082

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

logging:
  level:
    sn.edu.ept.api_gateway: DEBUG
    org.springframework.cloud.gateway: INFO
