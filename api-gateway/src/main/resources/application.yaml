server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:

        # ── Routes publiques auth — PAS de filtre JWT ────────────────────────
        - id: auth-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/login, /api/auth/register
          # Pas de filtre du tout — laisser passer sans token

        # ── Routes protégées auth ────────────────────────────────────────────
        - id: auth-protected
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: JwtAuthenticationFilter

        # ── Routes internes user — appelées par Feign, PAS de JWT ───────────
        - id: user-internal
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/internal/**
          # Pas de filtre — appels Feign internes entre services

        # ── Mon profil — JWT obligatoire ────────────────────────────────────
        - id: user-me
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/me
          filters:
            - name: JwtAuthenticationFilter   # injecte X-Auth-Id, X-User-Role, X-User-Email

        # ── Routes admin — JWT + rôle ADMIN ─────────────────────────────────
        - id: user-admin
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/all, /api/users/id/**, /api/users/auth/authId/**
          filters:
            - name: JwtAuthenticationFilter
            - name: RoleAuthorizationFilter
              args:
                requiredRole: ADMIN

        # ── Toutes les autres routes user — JWT obligatoire ─────────────────
        - id: user-protected
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**
          filters:
            - name: JwtAuthenticationFilter

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

eureka:
  client:
    enabled: false

jwt:
  secret: f04f05344920d1531fdb13ff408d825c5cf5012354e64651c466d6cede25e082

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

logging:
  level:
    sn.edu.ept.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG   # ← mettre DEBUG pour voir le routing